server {
    listen 172.30.1.1:8444 ssl;
    listen 127.0.0.1:8444 ssl;
    server_name typing-pet-admin.miel.ing;
    include /Users/miel/.config/nginx/snippets/common-tls-1.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    port_in_redirect off;
    client_max_body_size 4k;
    access_log off;
    error_log /Users/miel/server/typing-pet-share/logs/admin-nginx-error.log crit;
    location /outpost.goauthentik.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_redirect http://macmini:9000/ https://auth.miel.ing/;
        proxy_set_header Host typing-pet-admin.miel.ing;
        proxy_set_header X-Original-URL https://typing-pet-admin.miel.ing$request_uri;
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host typing-pet-admin.miel.ing;
        proxy_set_header Authorization "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        add_header Cache-Control "private, no-store" always;
    }
    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @signin;
        auth_request_set $typing_pet_admin_cookie $upstream_http_set_cookie;
        auth_request_set $typing_pet_admin_username $upstream_http_x_authentik_username;
        add_header Set-Cookie $typing_pet_admin_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://127.0.0.1:17868/admin/;
        proxy_set_header Host typing-pet-admin.miel.ing;
        proxy_set_header X-Authentik-Username $typing_pet_admin_username;
        include /Users/miel/.config/nginx/private/typing-pet-admin-upstream.conf;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location @signin {
        internal;
        add_header Cache-Control "private, no-store" always;
        return 302 /outpost.goauthentik.io/start?rd=https://typing-pet-admin.miel.ing$request_uri;
    }
}
