name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Check Todo time and storage
        run: ./scripts/check_todo.sh
      - name: Build release
        run: swift build -c release
