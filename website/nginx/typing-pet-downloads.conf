# Typing Pet downloads and app updates, independent of the homepage vhost.
map $args $typing_pet_download_args_valid {
    default 0;
    "" 1;
    "~^from=(github|direct)(&type=(dmg|zip))?$" 1;
    "~^type=(dmg|zip)(&from=(github|direct))?$" 1;
}
map $arg_from $typing_pet_download_source {
    default github;
    direct direct;
}
map $arg_type $typing_pet_download_type {
    default auto;
    dmg dmg;
    zip zip;
}
include /Users/miel/.config/nginx/snippets/typing-pet-download-targets.conf;

map $uri $typing_pet_file_cache {
    default "no-cache";
    /latest "no-store";
    /download/latest "no-store";
    ~^/update/production/TypingPet-\d+\.\d+\.\d+-\d+-arm64\.zip$ "public, max-age=31536000, immutable";
    ~^/update/production/TypingPetMac-v\d+\.\d+\.\d+-arm64(-installer)?\.dmg$ "public, max-age=31536000, immutable";
}
# Missing files, invalid parameters and disallowed methods must never be immutable.
map $status $typing_pet_cache_control {
    default "no-store";
    302 $typing_pet_file_cache;
    200 $typing_pet_file_cache;
    206 $typing_pet_file_cache;
    304 $typing_pet_file_cache;
}
map $typing_pet_cache_control $typing_pet_cdn_cache_control {
    default "no-store";
    "public, max-age=31536000, immutable" "public, max-age=31536000, immutable";
}
server {
    listen 172.30.1.1:8444 ssl;
    listen 127.0.0.1:8444 ssl;
    server_name pet.miel.ing;
    ssl_certificate /Users/miel/.local/share/lego-miel/certificates/miel.ing.crt;
    ssl_certificate_key /Users/miel/.local/share/lego-miel/certificates/miel.ing.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /Users/miel/.local/var/log/nginx/typing-pet/access.log nginx_watch;
    error_log /Users/miel/.local/var/log/nginx/typing-pet/error.log warn;
    autoindex off;
    charset utf-8;
    charset_types application/json;
    types {
        application/json json;
        application/zip zip;
        application/x-apple-diskimage dmg;
    }
    default_type application/octet-stream;
    add_header Cache-Control $typing_pet_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $typing_pet_cdn_cache_control always;
    add_header CDN-Cache-Control $typing_pet_cdn_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($uri ~ "(^|/)\.") { return 404; }
    if ($uri ~ /$) { return 404; }

    location = /latest {
        if ($typing_pet_download_args_valid = 0) { return 400; }
        if ($typing_pet_latest_target = "") { return 404; }
        return 302 $typing_pet_latest_target;
    }
    # Compatibility for the original ZIP-only download entry point.
    location = /download/latest {
        include /Users/miel/.config/nginx/snippets/typing-pet-latest.conf;
    }
    location ^~ /update/ {
        alias /Users/miel/TypingPetUpdate/;
        disable_symlinks on;
    }
    location / { return 404; }
}
# Dedicated HTTP redirect listener, ready for a public TCP 80 -> 8780 mapping.
# The existing router currently handles public port 80 itself.
server {
    listen 172.30.1.1:8780;
    listen 127.0.0.1:8780;
    server_name pet.miel.ing;
    access_log /Users/miel/.local/var/log/nginx/typing-pet/access.log nginx_watch;
    error_log /Users/miel/.local/var/log/nginx/typing-pet/error.log warn;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 301 https://pet.miel.ing$request_uri;
}
