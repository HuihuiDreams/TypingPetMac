# Mac mini static landing page. App updates stay on the independent pet host.
map $uri $typing_pet_site_file_cache {
    default "no-cache";
    ~^/assets/.*-[A-Za-z0-9_-]+\.(js|css|woff2)$ "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=86400";
}
map $status $typing_pet_site_cache {
    default "no-store";
    200 $typing_pet_site_file_cache;
    206 $typing_pet_site_file_cache;
    304 $typing_pet_site_file_cache;
}
server {
    listen 172.30.1.1:8444 ssl;
    listen 127.0.0.1:8444 ssl;
    server_name typing-pet.miel.ing;
    ssl_certificate /Users/miel/.local/share/lego-miel/certificates/miel.ing.crt;
    ssl_certificate_key /Users/miel/.local/share/lego-miel/certificates/miel.ing.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /Users/miel/server/typing-pet-site/current;
    index index.html;
    autoindex off;
    gzip on;
    gzip_min_length 1000;
    gzip_types application/javascript text/css application/json image/svg+xml application/xml text/plain;
    charset utf-8;
    access_log /Users/miel/.local/var/log/nginx/typing-pet-site/access.log nginx_watch;
    error_log /Users/miel/.local/var/log/nginx/typing-pet-site/error.log warn;
    add_header Cache-Control $typing_pet_site_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ (^|/)\. { return 404; }
    location = /release.json { return 404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 172.30.1.1:8780;
    listen 127.0.0.1:8780;
    server_name typing-pet.miel.ing;
    return 301 https://typing-pet.miel.ing$request_uri;
}
