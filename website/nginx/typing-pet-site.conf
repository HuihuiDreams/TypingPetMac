# Mac mini static landing page. App updates stay on the independent pet host.
map $request_uri $typing_pet_site_file_cache {
    default "no-cache";
    ~^/relay/ "no-store";
    ~^/assets/.*-[A-Za-z0-9_-]+\.(js|css|woff2)(\?.*)?$ "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=86400";
}
map $status $typing_pet_site_cache {
    default "no-store";
    200 $typing_pet_site_file_cache;
    206 $typing_pet_site_file_cache;
    304 $typing_pet_site_file_cache;
}
map "$request_method:$uri" $typing_pet_site_method_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    ~^POST:/relay/(e|i/v0/e)/?$ 1;
}
server {
    listen 172.30.1.1:8444 ssl;
    listen 127.0.0.1:8444 ssl;
    server_name typing-pet.miel.ing;
    ssl_certificate /Users/miel/.local/share/lego-miel/certificates/miel.ing.crt;
    ssl_certificate_key /Users/miel/.local/share/lego-miel/certificates/miel.ing.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /Users/miel/server/typing-pet-site/current;
    index index.html;
    autoindex off;
    gzip on;
    gzip_min_length 1000;
    gzip_types application/javascript text/css application/json image/svg+xml application/xml text/plain;
    charset utf-8;
    access_log /Users/miel/.local/var/log/nginx/typing-pet-site/access.log nginx_watch;
    error_log /Users/miel/.local/var/log/nginx/typing-pet-site/error.log warn;
    add_header Cache-Control $typing_pet_site_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" always;
    if ($typing_pet_site_method_allowed = 0) { return 405; }

    # Same-origin PostHog US proxy. TLS verification stays enabled upstream.
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $typing_pet_posthog_upstream us.i.posthog.com;
    proxy_ssl_server_name on;
    proxy_ssl_name $typing_pet_posthog_upstream;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /opt/homebrew/etc/openssl@3/cert.pem;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_set_header Host $typing_pet_posthog_upstream;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location ~ ^/relay/(e|i/v0/e)/?$ {
        if ($request_method != POST) { return 405; }
        client_max_body_size 256k;
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass https://$typing_pet_posthog_upstream$uri$is_args$args;
    }
    location ^~ /relay/static/ {
        set $typing_pet_posthog_upstream us-assets.i.posthog.com;
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass https://$typing_pet_posthog_upstream$uri$is_args$args;
    }
    location ^~ /relay/array/ {
        set $typing_pet_posthog_upstream us-assets.i.posthog.com;
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass https://$typing_pet_posthog_upstream$uri$is_args$args;
    }
    location = /relay { return 404; }
    location /relay/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location = /release.json { return 404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 172.30.1.1:8780;
    listen 127.0.0.1:8780;
    server_name typing-pet.miel.ing;
    return 301 https://typing-pet.miel.ing$request_uri;
}
